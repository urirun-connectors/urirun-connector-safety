[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "urirun-connector-safety"
version = "0.1.0"
description = "Silnik zaufania: kiedy autonomia jest prowadnie bezpieczna (izolacja+odwracalność+verify+twin) + strategie (safe://)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Tom Sapletta" }]
dependencies = ["urirun>=0.4.14"]
[project.optional-dependencies]
test = ["pytest>=8", "urirun-connector-email"]
[project.entry-points."urirun.bindings"]
safety = "urirun_connector_safety.core:urirun_bindings"
[tool.setuptools.packages.find]
include = ["urirun_connector_safety*"]
